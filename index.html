<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supplier Selection System</title>
  <style>
    :root { --grad1:#667eea; --grad2:#764ba2; --ink:#2d3748; --muted:#4a5568; }
    *{box-sizing:border-box}
    body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;margin:0;padding:20px;background:linear-gradient(135deg,var(--grad1) 0%,var(--grad2) 100%);min-height:100vh}
    .container{max-width:1200px;margin:0 auto;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:20px;padding:30px;box-shadow:0 20px 40px rgba(0,0,0,.1)}
    h1{text-align:center;color:var(--ink);margin-bottom:30px;font-size:2.2em;background:linear-gradient(45deg,var(--grad1),var(--grad2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .input-section{background:#fff;padding:25px;border-radius:15px;margin-bottom:25px;box-shadow:0 10px 25px rgba(0,0,0,.08);border:1px solid rgba(102,126,234,.2)}
    .postcode-input{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
    input[type=text], input[type=password], input[type=email]{padding:12px 16px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;transition:.3s;min-width:160px}
    input:focus{outline:none;border-color:var(--grad1);box-shadow:0 0 0 3px rgba(102,126,234,.1)}
    .services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
    .service-item{display:flex;align-items:center;padding:10px;background:#f8fafc;border-radius:8px;transition:.3s;cursor:pointer}
    .service-item:hover{background:#e6fffa;transform:translateY(-2px)}
    .service-item.selected{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff}
    input[type=checkbox]{margin-right:10px;transform:scale(1.1);cursor:pointer}
    .btn{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;border:none;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.3s;text-decoration:none;display:inline-block}
    .btn.alt{background:#e2e8f0;color:#1f2937}
    .btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(102,126,234,.4)}
    .results-section{background:#fff;padding:20px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,.08);border:1px solid rgba(102,126,234,.2)}
    .supplier-card{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);border-radius:12px;padding:16px;margin:12px 0;border-left:4px solid var(--grad1);transition:.3s}
    .supplier-card:hover{transform:translateX(5px);box-shadow:0 10px 25px rgba(0,0,0,.1)}
    .supplier-name{font-size:1.15em;font-weight:700;color:var(--ink);margin-bottom:6px}
    .supplier-details{color:var(--muted);font-size:.95em}
    .distance{font-weight:700;color:var(--grad1)}
    .no-results{text-align:center;color:#718096;font-style:italic;padding:40px}
    .loading{text-align:center;padding:20px;color:var(--grad1);animation:pulse 2s infinite}
    .debug{margin-top:16px;font-size:.9em;color:#1f2937;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:10px}
    .err{color:#b91c1c}
    .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .muted{color:#6b7280}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    /* Login overlay */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:center;z-index:9999}
    .login-card{width:380px;background:#fff;border-radius:14px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .login-card h2{margin:0 0 10px 0}
    .row{display:flex;flex-direction:column;gap:6px;margin:10px 0}
    .row label{font-weight:600;color:#334155}
    .error{color:#b91c1c;font-size:.9em;min-height:1.2em}
  </style>
</head>
<body>
  <div id="loginOverlay" class="overlay">
    <div class="login-card">
      <h2>Sign in</h2>
      <div class="row"><button class="btn" id="btnGoogle">Continue with Google</button></div>
      <div class="row"><div class="muted" style="text-align:center">— or —</div></div>
      <div class="row"><label for="loginEmail">Email</label><input id="loginEmail" type="email" /></div>
      <div class="row"><label for="loginPass">Password</label><input id="loginPass" type="password" /></div>
      <div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="btn" id="btnEmailLogin">Sign in</button></div>
      <div id="loginErr" class="error"></div>
    </div>
  </div>

  <div class="container" id="app" style="display:none">
    <div class="topbar">
      <h1>🎯 Supplier Selection System</h1>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span id="whoami" class="muted"></span>
        <a href="manage.html" class="btn">⚙️ Manage Suppliers</a>
        <button class="btn alt" id="btnSignOut">Sign out</button>
      </div>
    </div>

    <div class="input-section">
      <h3>📍 Customer Location & Requirements</h3>
      <div class="postcode-input">
        <label for="postcode"><strong>Customer Postcode:</strong></label>
        <input type="text" id="postcode" placeholder="e.g., OL4 2QS">
        <div class="actions">
          <button class="btn" onclick="findSuppliers(false)">🔍 Find Top 3</button>
          <button class="btn alt" onclick="findSuppliers(true)">🧾 Show All Matches</button>
          <button class="btn alt" onclick="clearAll()">🗑️ Clear</button>
        </div>
      </div>
      <h4>Services Required:</h4>
      <div class="services-grid" id="servicesGrid"></div>
      <div id="debug" class="debug" hidden>loading…</div>
    </div>

    <div class="results-section">
      <h3 id="resultsTitle">📋 Matching Suppliers</h3>
      <div id="results"><div class="no-results">Select services and click one of the buttons above</div></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const q = s => document.querySelector(s);
    const appRoot = q('#app');
    const loginOverlay = q('#loginOverlay');
    const loginErr = q('#loginErr');

    const firebaseConfig = {
      apiKey: "AIzaSyCjUNXtUu0mIBOq6GK5QnwzLhVj18KcQ9E",
      authDomain: "testauthentication-7b4d5.firebaseapp.com",
      projectId: "testauthentication-7b4d5",
      storageBucket: "testauthentication-7b4d5.firebasestorage.app",
      messagingSenderId: "175852328677",
      appId: "1:175852328677:web:4e7ea0a66400fa477da60c"
    };

    const appFB = initializeApp(firebaseConfig);
    const auth = getAuth(appFB);
    const db = getFirestore(appFB); // Init DB
    await setPersistence(auth, browserLocalPersistence);

    q('#btnGoogle').addEventListener('click', async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { loginErr.textContent = e.message; } });
    q('#btnEmailLogin').addEventListener('click', async () => { try { await signInWithEmailAndPassword(auth, q('#loginEmail').value.trim(), q('#loginPass').value); } catch (e) { loginErr.textContent = e.message; } });
    q('#btnSignOut').addEventListener('click', async () => { await signOut(auth); });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        q('#whoami').textContent = user.email || '(signed in)';
        loginOverlay.style.display = 'none';
        appRoot.style.display = 'block';
        startApp();
      } else {
        appRoot.style.display = 'none';
        loginOverlay.style.display = 'flex';
      }
    });

    let suppliers = [];
    const servicesSet = new Set();
    const pcCache = new Map(JSON.parse(localStorage.getItem("pcCache") || "[]"));

    function normalisePC(pc) {
      if (!pc) return '';
      const cleaned = String(pc).replace(/\u00A0/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
      if (!cleaned || /^ONLINE\b|^EMAIL\b/i.test(cleaned)) return '';
      const t = cleaned.replace(/\s+/g,'');
      if (t.length < 5) return cleaned;
      return t.slice(0, t.length-3) + ' ' + t.slice(-3);
    }

    async function loadSuppliers() {
      const dbg = q('#debug');
      dbg.hidden = false; dbg.textContent = 'Fetching suppliers from Firestore...';
      try {
        const snap = await getDocs(collection(db, "suppliers"));
        suppliers = [];
        snap.forEach(d => {
            const data = d.data();
            suppliers.push({
                name: data.name || '',
                postcode: normalisePC(data.postcode),
                phone: data.phone || '',
                services: Array.isArray(data.services) ? data.services : []
            });
        });

        servicesSet.clear();
        suppliers.forEach(s => s.services.forEach(sv => servicesSet.add(sv)));
        dbg.textContent = `Loaded ${suppliers.length} suppliers from cloud.`;
        initializeServices();
      } catch (err) {
        dbg.innerHTML = `<span class="err">Error: ${err.message} (Did you enable Firestore in console?)</span>`;
      }
    }

    function initializeServices() {
      const grid = q('#servicesGrid');
      grid.innerHTML = '';
      [...servicesSet].sort().forEach(service => {
        const div = document.createElement('div');
        div.className = 'service-item';
        div.onclick = () => {
          const cb = div.querySelector('input');
          cb.checked = !cb.checked;
          div.classList.toggle('selected', cb.checked);
        };
        div.innerHTML = `<input type="checkbox" id="service-${service}"><label for="service-${service}">${service}</label>`;
        grid.appendChild(div);
      });
    }

    window.findSuppliers = async function(showAll) {
      const rawPC = q('#postcode').value.trim();
      const customerPostcode = normalisePC(rawPC);
      const selected = Array.from(document.querySelectorAll('#servicesGrid input:checked')).map(cb => cb.id.replace('service-',''));
      const resDiv = q('#results');

      if (!rawPC) return resDiv.innerHTML = '<div class="no-results">Enter customer postcode</div>';
      if (!selected.length) return resDiv.innerHTML = '<div class="no-results">Select at least one service</div>';
      resDiv.innerHTML = '<div class="loading">🔍 Calculating...</div>';

      const matching = suppliers.filter(s => selected.some(sv => s.services.includes(sv)));
      if (!matching.length) return resDiv.innerHTML = '<div class="no-results">No matches found</div>';

      const enriched = await Promise.all(matching.map(async s => {
        try { const km = await bestDistanceKm(customerPostcode, s.postcode); return { ...s, distance: km }; }
        catch (e) { return { ...s, distance: null }; }
      }));

      const sorted = enriched.sort((a, b) => {
        if (a.distance === null) return 1;
        if (b.distance === null) return -1;
        return a.distance - b.distance;
      });

      const display = showAll ? sorted : sorted.slice(0, 3);
      q('#resultsTitle').textContent = showAll ? '📋 All Matching Suppliers' : '📋 Top 3 by Distance';
      
      resDiv.innerHTML = display.map((s, i) => `
          <div class="supplier-card">
            <div class="supplier-name">${i + 1}. ${s.name}</div>
            <div class="supplier-details">
              📍 <strong>Postcode:</strong> ${s.postcode || '—'} |
              📞 <strong>Phone:</strong> ${s.phone || '<span class="muted">N/A</span>'} |
              📏 <strong>Distance:</strong> <span class="distance">${s.distance ? s.distance.toFixed(1) + ' km' : 'N/A'}</span><br>
              🛠️ <strong>Services:</strong> ${s.services.join(', ')}
            </div>
          </div>`).join('');
    };
    
    window.clearAll = function() {
       q('#postcode').value = '';
       document.querySelectorAll('.service-item input').forEach(c => { c.checked = false; c.parentElement.classList.remove('selected'); });
       q('#results').innerHTML = '<div class="no-results">Select services...</div>';
    };

    async function geocode(pc) {
      if (pcCache.has(pc)) return pcCache.get(pc);
      const res = await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(pc)}`);
      const data = await res.json();
      if (data.status !== 200) throw new Error();
      const ll = { lat: data.result.latitude, lon: data.result.longitude };
      pcCache.set(pc, ll); localStorage.setItem("pcCache", JSON.stringify([...pcCache]));
      return ll;
    }
    async function bestDistanceKm(aPC, bPC) {
      const [A, B] = await Promise.all([geocode(aPC), geocode(bPC)]);
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${A.lon},${A.lat};${B.lon},${B.lat}?overview=false`);
        const data = await res.json();
        return data.routes[0].distance / 1000;
      } catch {
        // Haversine fallback
        const R=6371, dLat=(B.lat-A.lat)*Math.PI/180, dLon=(B.lon-A.lon)*Math.PI/180;
        const a=Math.sin(dLat/2)**2+Math.cos(A.lat*Math.PI/180)*Math.cos(B.lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
      }
    }

    async function startApp() { await loadSuppliers(); }
  </script>
</body>
</html>
